<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Seleksi Foto - Dashboard & Galeri</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
        }
        #appFrame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        /* Loading Animasi saat pertama dibuka */
        #loader {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            color: #ffffff;
            font-family: sans-serif;
            z-index: 999;
            transition: opacity 0.4s ease;
        }
        .spinner {
            width: 42px;
            height: 42px;
            border: 4px solid rgba(255,255,255,0.15);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <div style="font-size: 14px; font-weight: 600; letter-spacing: 0.5px;">Memuat Galeri...</div>
    </div>

    <iframe id="appFrame" 
            src="" 
            allow="clipboard-read; clipboard-write; fullscreen; camera; microphone" 
            loading="eager">
    </iframe>

    <script>
        // 1. MASUKKAN LINK EXEC WEB APP GOOGLE APPS SCRIPT ANDA DI BAWAH INI:
        var GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycby-2Fa7q5ZObc7D8_bRs7aJH-gYCzDXq-Ms2njEXtV7Zuj4LYekorYJnGxR67B-Qofs/exec";

        // 2. Teruskan parameter URL (seperti ?galeri=GAL-123 atau ?page=client) secara otomatis
        var currentParams = window.location.search;
        var frame = document.getElementById('appFrame');
        var loader = document.getElementById('loader');

        frame.src = GAS_WEBAPP_URL + currentParams;

        // Hilangkan loader begitu aplikasi Google selesai dimuat
        frame.onload = function() {
            loader.style.opacity = '0';
            setTimeout(function() {
                loader.style.display = 'none';
            }, 400);
        };
    </script>
</body>
</html>
